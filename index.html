<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actuarial &amp; Data Science News</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e3e3df; --accent: #1f5c8b; --chip: #eeeeea; --chip-on: #1f5c8b;
    --chip-on-ink: #fff; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --ink: #e8e8e4; --muted: #9a9a94;
      --line: #2e3136; --accent: #6fa8d1; --chip: #282b30; --chip-on: #6fa8d1;
      --chip-on-ink: #16171a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .hrow { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;
    padding: 8px 15px; cursor: pointer; border-radius: 8px;
    background: var(--accent); color: var(--panel); border: 1px solid transparent;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: default; }
  .status {
    margin: 12px 0 0 !important; font-size: 13.5px; padding: 9px 12px;
    border-radius: 8px; background: var(--chip); border: 1px solid var(--line);
  }
  .status.ok { border-color: #2e7d52; }
  .status.err { border-color: #b3453b; }
  .status.warn { border-color: #b08300; }
  @media (max-width: 560px) {
    .hrow { flex-direction: column; }
    .btn { width: 100%; }
  }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin: 24px 0; box-shadow: var(--shadow);
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 14px; }
  .lbl {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); min-width: 92px; font-weight: 600;
  }
  input[type=search], select {
    font: inherit; font-size: 14px; padding: 7px 10px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  }
  input[type=search] { flex: 1 1 200px; min-width: 0; }
  .chip {
    font: inherit; font-size: 13px; padding: 5px 11px; cursor: pointer;
    background: var(--chip); color: var(--ink);
    border: 1px solid transparent; border-radius: 999px;
  }
  .chip[aria-pressed=true] { background: var(--chip-on); color: var(--chip-on-ink); }
  .chip.reset { background: transparent; border-color: var(--line); color: var(--muted); }

  .count { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .notes {
    margin: 0 0 24px; font-size: 13px; color: var(--muted);
    border-left: 2px solid var(--line); padding: 2px 0 2px 12px;
  }
  .notes ul { margin: 4px 0 0; padding-left: 18px; }

  h2.sec {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 32px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  article {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  article h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.35; }
  article h3 a { color: var(--ink); text-decoration: none; }
  article h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .sum { margin: 0 0 12px; font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--bg);
  }
  .tag.pa { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <div>
        <h1>Actuarial &amp; Data Science News</h1>
        <p id="sub"></p>
      </div>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
    <p class="status" id="status" hidden></p>
  </header>

  <div class="panel">
    <div class="row">
      <span class="lbl">Search</span>
      <input type="search" id="q" placeholder="Headline, summary, or source…">
      <select id="date"></select>
      <select id="section">
        <option value="">Both sections</option>
        <option value="actuarial">Actuarial</option>
        <option value="data_science">Data Science</option>
      </select>
    </div>
    <div class="row"><span class="lbl">Practice</span><span id="pa" class="row"></span></div>
    <div class="row"><span class="lbl">Business line</span><span id="bl" class="row"></span></div>
    <div class="row">
      <span class="lbl">Source</span>
      <select id="source"></select>
      <button class="chip reset" id="reset" type="button">Reset filters</button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div id="notes"></div>
  <div id="list"></div>

  <footer id="foot"></footer>
</div>

k (claims trends, mortality, macro drivers) where the causal structure isn't assumed stationary. Code is available at github.com/bloomberg/causal-ts.", "practiceArea": "Predictive Modeling", "businessLine": null}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Generative crowdsourcing model jointly models item difficulty and class-dependent annotator skill to recover rare labels", "url": "http://arxiv.org/abs/2607.24622v1", "source": "arXiv cs.LG", "published": "2026-07-27", "summary": "Singer, Gruffaz, Vo Van and Vayatis address class-imbalanced crowdsourced labeling, where annotators can be uniformly reliable, uniformly unreliable, or specialists on just the majority or minority class -- and where the minority label is usually the operationally important one (e.g., a rare defect or fraud flag). Prior label-aggregation models capture either class-dependent annotator error or item difficulty, but not both together; this paper introduces a generative model combining both, revisits Condorcet's Jury Theorem under class imbalance, and proves majority voting asymptotically preserves the true class proportion. Evaluated across 33 real-world crowdsourcing datasets (images and text, spanning both many-annotations-per-item and many-items regimes), the model consistently achieves the best minority-class recall while staying competitive on balanced accuracy. This is directly transferable to insurance rare-event labeling problems -- claims-fraud flagging, SIU referral triage, underwriting red-flag review -- where multiple reviewers disagree and the rare positive class is what actually matters.", "practiceArea": "Predictive Modeling", "businessLine": null}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Consolidated best-practices guide for building large-scale ML-derived maps from Earth observation data", "url": "http://arxiv.org/abs/2607.24532v1", "source": "arXiv cs.LG", "published rience-rating problem underlying workers' comp and commercial GL/auto pricing. The authors show the two approaches are complementary rather than substitutes, with ML able to supplement but not replace credibility-based judgment in practice. The Editor-in-Chief specifically framed the result as showing how classical and modern techniques \"can work together to improve ratemaking,\" giving pricing actuaries a concrete basis for blending the two in commercial lines rate filings.", "practiceArea": "Pricing", "businessLine": "Commercial Insurance"}, {"date": "2026-07-28", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "CAS releases second edition of its AI Primer, adding agentic AI guidance and an AI-driven reserving workflow", "url": "https://www.casact.org/article/second-edition-cas-ai-primer-now-available", "source": "CAS", "published": "2026-07-27", "summary": "The Casualty Actuarial Society published the second edition of \"The CAS AI Primer: Practical Guidance for Actuaries\" on July 27, 2026, maintained by the CAS Artificial Intelligence Working Group on a quarterly review cycle. New in this edition: a section on agentic AI covering its operational mechanics, workflow integration, adoption frameworks and risks; updated descriptions of current AI models' actuarial capabilities; and a visual walkthrough of an AI-driven claims reserving process. The primer's throughline is responsible use -- validation, governance, and retained professional judgment -- rather than wholesale automation. It targets P&C actuaries at all AI-experience levels rather than one specific line, so treat this as cross-cutting governance guidance rather than a line-specific development.", "practiceArea": "AI/ML/Deep Learning", "businessLine": "Other"}, {"date": "2026-07-28", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "M6.8 earthquake strikes Kumamoto, Japan, damaging commercial and industrial property", "url": "https://www.artemis.bm/news/japan-struck-by-m nal recovery after a quake. It is aimed broadly at Japanese businesses seeking protection beyond traditional indemnity-based property cover, closing a protection gap for corporates that need fast liquidity rather than a lengthy claims-adjustment process. No policy limits, pricing, or initial take-up figures were disclosed at launch (July 28, 2026).", "practiceArea": "ERM", "businessLine": "Commercial Insurance"}]}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('payload').textContent);
  var PA = ["Pricing", "Reserving", "Predictive Modeling", "AI/ML/Deep Learning", "ERM", "Capital Modelling", "Other"], BL = ["Personal Insurance", "Commercial Insurance", "Reinsurance", "Consulting", "Other"];
  var state = { q: '', date: '', section: '', pa: [], bl: [], source: '' };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {

  }

  $('sub').textContent = D.dates.length

      return;
    }
    var html = '';
    [['actuarial', 'Actuarial'], ['data_science', 'Data Science']].forEach(function (s) {
      var group = shown.filter(function (i) { return i.section === s[0]; });
      if (!group.length) return;
      html += '<h2 class="sec">' + s[1] + ' · ' + group.length + '</h2>' +
        group.map(card).join('');
    });
    $('list').innerHTML = html;
  }

  // ---- Refresh button -------------------------------------------------------
  // Served from localhost by serve.py, the button really runs the refresh. On the
  // hosted page there is no backend to call, so it opens the scheduled routine
  // instead — triggering a cloud run from the browser would need a token, and this
  // page is public.
  var ROUTINE_URL = "https://claude.ai/code/routines/trig_011WCaBkju3UMBApJV2QZ2W6";
  var local = ['localhost', '127.0.0.1', '[::1]', ''].indexOf(location.hostname) >= 0
    && location.protocol !== 'file:';
  var btn = $('refresh'), statusEl = $('status');

  function say(msg, kind) {
    statusEl.hidden = !msg;
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  btn.textContent = local ? 'Refresh now' : 'Refresh…';
  btn.title = local
    ? "Fetch today's news and rebuild this page"
    : 'Opens the scheduled routine, where you can run it on demand';

  btn.addEventListener('click', function () {
    if (!local) {
      window.open(ROUTINE_URL, '_blank', 'noopener');
      say('Opened the routine in a new tab — press “Run now” there. This page picks up the ' +
          'result a minute or two after the run finishes. To refresh from your own machine ' +
          'instead, run: python3 serve.py');
      return;
    }
    btn.disabled = true;
    say('Starting…');
    fetch('/api/refresh', { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.state === 'busy') { say('A refresh is already running.', 'warn'); btn.disabled = false; }
        else { poll(); }
      })
      .catch(function () {
        say('Could not reach the local helper. Start it with: python3 serve.py', 'err');
        btn.disabled = false;
      });
  });

  function poll() {
    fetch('/api/refresh/status')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.state === 'running') {
          say('Reading articles… this takes a few minutes.' + (j.last ? ' — ' + j.last : ''));
          setTimeout(poll, 2500);
        } else if (j.state === 'done') {
          say('Done — reloading.', 'ok');
          setTimeout(function () { location.reload(); }, 800);
        } else {
          say('Refresh failed: ' + (j.last || 'check the serve.py console'), 'err');
          btn.disabled = false;
        }
      })
      .catch(function () {
        say('Lost contact with the local helper.', 'err');
        btn.disabled = false;
      });
  }

  $('foot').textContent = 'Generated ' + D.generated + ' by build.py · static file, no runtime dependencies';
  render();
})();
</script>
</body>
</html>
