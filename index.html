<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB for a Better Actuary</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e3e3df; --accent: #1f5c8b; --chip: #eeeeea; --chip-on: #1f5c8b;
    --chip-on-ink: #fff; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --ink: #e8e8e4; --muted: #9a9a94;
      --line: #2e3136; --accent: #6fa8d1; --chip: #282b30; --chip-on: #6fa8d1;
      --chip-on-ink: #16171a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .tagline { margin: 0 0 4px !important; font-size: 13.5px; }
  .hrow { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap;
    padding: 8px 15px; cursor: pointer; border-radius: 8px;
    background: var(--accent); color: var(--panel); border: 1px solid transparent;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: default; }
  .status {
    margin: 12px 0 0 !important; font-size: 13.5px; padding: 9px 12px;
    border-radius: 8px; background: var(--chip); border: 1px solid var(--line);
  }
  .status.ok { border-color: #2e7d52; }
  .status.err { border-color: #b3453b; }
  .status.warn { border-color: #b08300; }
  @media (max-width: 560px) {
    .hrow { flex-direction: column; }
    .btn { width: 100%; }
  }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin: 24px 0; box-shadow: var(--shadow);
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 14px; }
  .lbl {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); min-width: 92px; font-weight: 600;
  }
  input[type=search], select {
    font: inherit; font-size: 14px; padding: 7px 10px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  }
  input[type=search] { flex: 1 1 200px; min-width: 0; }
  .chip {
    font: inherit; font-size: 13px; padding: 5px 11px; cursor: pointer;
    background: var(--chip); color: var(--ink);
    border: 1px solid transparent; border-radius: 999px;
  }
  .chip[aria-pressed=true] { background: var(--chip-on); color: var(--chip-on-ink); }
  .chip.reset { background: transparent; border-color: var(--line); color: var(--muted); }

  .count { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .notes {
    margin: 0 0 24px; font-size: 13px; color: var(--muted);
    border-left: 2px solid var(--line); padding: 2px 0 2px 12px;
  }
  .notes ul { margin: 4px 0 0; padding-left: 18px; }

  h2.sec {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 32px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  article {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  article h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.35; }
  article h3 a { color: var(--ink); text-decoration: none; }
  article h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .sum { margin: 0 0 12px; font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--bg);
  }
  .tag.pa { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <div>
        <h1>DB for a Better Actuary</h1>
        <p class="tagline">Commercial P&amp;C and data science, daily.</p>
        <p id="sub"></p>
      </div>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
    <p class="status" id="status" hidden></p>
  </header>

  <div class="panel">
    <div class="row">
      <span class="lbl">Search</span>
      <input type="search" id="searchQuery" placeholder="Add a keyword to the database…">
      <select id="searchType">
        <option value="News">News</option>
        <option value="Article">Article</option>
        <option value="Research">Research</option>
        <option value="Publication">Publication</option>
      </select>
      <button class="chip" id="addSearch" type="button">Add to database</button>
    </div>
    <div class="row">
      <span class="lbl">Filter</span>
      <input type="search" id="q" placeholder="Filter current items…">
      <select id="publishedDate"></select>
      <select id="section">
        <option value="">Both sections</option>
        <option value="actuarial">Actuarial</option>
        <option value="data_science">Data Science</option>
      </select>
    </div>
    <div class="row"><span class="lbl">Practice</span><span id="pa" class="row"></span></div>
    <div class="row"><span class="lbl">Business line</span><span id="bl" class="row"></span></div>
    <div class="row"><span class="lbl">Type</span><span id="it" class="row"></span></div>
    <div class="row">
      <span class="lbl">Source</span>
      <select id="source"></select>
      <button class="chip reset" id="reset" type="button">Reset filters</button>
    </div>
    <div class="row">
      <span class="lbl">View</span>
      <select id="viewMode">
        <option value="archive">Historical archive</option>
        <option value="latest">Latest run</option>
      </select>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div id="list"></div>

  <footer id="foot"></footer>
</div>

es), Louisiana homeowners fraud arrest (personal lines), several people-moves and agency M&A items, and general wire news with no insurance framing (OpenAI/Hugging Face breach, EU sanctions, wage-and-hour settlements).", "Carrier Management: 10 raw items; 'Construction Jobsite Theft' already in seen.json from 2026-07-28. 1 new item kept (AI doubling cyber-vulnerability discovery). Dropped: Zurich/Finma sales-ban story (explicitly names Zurich's 'corporate life and pensions unit' -- out of scope), a staged-accident fraud bill (primarily personal-auto fraud), a LexisNexis Home severity report (explicitly homeowners/personal lines), and leadership/diversity/Tesla items with no P&C substance.", "Claims Journal: 15 raw items, mostly duplicates of Insurance Journal/Business Insurance wire stories or already in seen.json (J&J talc settlement, AI cyber-flaws story duplicated from Carrier Management). 1 new item kept (Aon on insurer rewards for climate resilience spending). Dropped as duplicate of yesterday's already-published items: 'Can Captive's Hands-On Vetting of Bars...' (same story as yesterday's Insurance Journal item) and 'Edison Rejects Blame for LA Fire...' (same story as yesterday's Insurance Journal item). A sponsored AI-medical-record-summarization piece was dropped as vendor-native advertising with no independent substance.", "Reinsurance News: 10 raw items. 5 new items kept (Kumamoto quake insured-loss estimate from Howden Re; Hanover Q2 net income/combined ratio; Rokstone Agriculture livestock capacity; Verisk/McKenzie catastrophe-intelligence acquisition; EXPAS explosion-risk platform). Dropped as thin/capital-markets-mechanics or low P&C substance: Lemonade Q2 revenue (personal-lines insurtech carrier -- renters/home/pet/auto), European insurer earnings outlook from S&P (broad macro, no commercial P&C specificity), Aon Reinsurance Solutions Q2 revenue (broking revenue only), PPL market-intelligence dashboard launch (operational tool, thin), and Lloyd's ESG is dated 16 July 2026, outside the 7-day window (2026-07-23 onward). 0 kept.", "InsuranceERM: skipped per standing guidance -- confirmed Cloudflare block, not retried.", "arXiv export API (export.arxiv.org/api/query) returned HTTP 429/503 rate-limit errors on both cs.LG and stat.ML queries after one retry each; fell back to the rss.arxiv.org/rss/cs.LG and rss.arxiv.org/rss/stat.ML feeds per the documented fallback, which returned HTTP 200 with 245 and 35 items respectively (both dated 2026-07-29, a daily digest of new submissions).", "Data Science: screened both feeds by keyword against the 3b keep list (insurance, actuarial, claims, survival analysis, tabular, calibration, conformal prediction, uncertainty quantification, heavy-tailed, catastrophe, climate, etc.) across full abstracts, then read full abstracts for the strongest candidates. Kept 5: FinAbstain (calibrated/abstaining financial forecasting), OOD evaluation of tabular foundation models, bias-corrected Cox regression with AI-extracted covariates, Generalised Robust Bayes for joint model/contamination inference, and Student's t likelihood for Bayesian neural networks. Passed over as too narrow or not transferable: 'HeAD-CP' conformal prediction for heterophilic graph neural networks (genuine conformal-prediction keyword match but a narrow GNN-benchmark contribution with no stated insurance/actuarial transfer) and 'Human Preference aligned Tabular Similarity' (tabular embeddings for a Product Lifecycle Management similarity-search use case, not predictive modeling).", "Hugging Face trending papers: today's list is robotics/multimodal/video-generation heavy (HiFi-UMI manipulation policies, ReDesign image-to-design, Mage-VL streaming multimodal model, NVIDIA video-generation distillation) -- 0 items passing 3b.", "Towards Data Science: reviewed all 20 feed items. Two (the Adam-optimizer piece and the active-learning piece) were already in seen.json from 2026-07-28. The rest are general AI-engineering/tooling explainers (vehicle-routing heuristics, MCP explainer, local-LLM wattage-cost measurement, backpropagation tutorial, vector-search infrastructure) without actuarial, tabular-modeling, or uncertainty-quantification substance under 3b. 'Tabular LLMs: An Introduction to the Foundation Models That Predict Your Spreadsheet' (published 2026-07-24) is topically on point but falls outside the 24-48h data-science window relative to this run. 0 kept.", "Google Research blog: most recent post remains 'SymptomAI' dated 2026-07-22, outside the 24-48h window. 0 items.", "Totals: 17 actuarial items, 5 data science items, 22 new items total for 2026-07-29. Actuarial landed above the 5-8 target given the six commercial-lines trade feeds' continued high yield after dedup against yesterday's seen.json; data science landed below target primarily because arXiv's rate-limiting cost time better spent reading full abstracts on a smaller, higher-confidence candidate set rather than casting wider."]}, "items": [{"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Rethinking Likelihood Distributions: Student's t Likelihood Boosts Bayesian Neural Network Performance", "url": "https://arxiv.org/abs/2607.25376", "source": "arXiv cs.LG", "published": "2026-07-29", "summary": "This paper tests alternative likelihood distributions for Bayesian neural networks and finds Student's t consistently outperforms the standard Gaussian likelihood across regression tasks, independent of dataset or network architecture. Heavy-tailed likelihoods are already standard for modeling claims severity in actuarial work, so this result extends that intuition into deep uncertainty-quantification methods. It's a simple, easy-to-implement swap that predictive modeling teams using Bayesian neural nets for loss or severity forecasting could test directly.", "practiceArea": "AI/ML/Deep Learning", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Generalised Robust Bayes for Joint Inference of Model and Contamination", "url": "https://arxiv.org/abs/2607.25665", "source": "arXiv stat.ML", "published": "2026-07-29", "summary": "This paper introduces Hölder-Bayes, a Bayesian framework that jointly estimates model parameters and the proportion of contaminated outlier data, rather than only producing qualitatively robust posteriors as prior methods do. It derives theoretical bias bounds and converts posterior uncertainty into an observation-level outlier score without needing an external detection threshold. The joint estimate is relevant to actuarial reserving and pricing, where flagging anomalous claims or loss data matters as much as the underlying parameter estimate.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "FinAbstain: Uncertainty-Calibrated Multimodal RAG for Selective Financial Forecasting", "url": "https://arxiv.org/abs/2607.24875", "source": "arXiv cs.LG", "published": "2026-07-29", "summary": "FinAbstain proposes a research framework for uncertainty-calibrated financial forecasting that combines retrieval-augmented generation with temperature scaling, isotonic regression, and conformal prediction to decide when a model should abstain rather than guess. The abstention-based design directly parallels actuarial practice of flagging cases for human review when model confidence is low. It's a useful template for building selective-prediction pipelines in any forecasting task where overconfidence is costly, including pricing and reserving.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Empirical Evaluation of Out-Of-Distribution Performance of Tabular Foundation Models", "url": "https://arxiv.org/abs/2607.26000", "source": "arXiv cs.LG", "published": "2026-07-29", "summary": "This paper benchmarks nine tabular foundation models, including TabPFN and TabICL variants, on out-of-distribution performance across datasets with label, socioeconomic, and geographic shift, finding all degrade systematically once deployment distributions diverge from training. The result confirms that the classical in-distribution-versus-OOD gap seen in tree-based models has not been solved by tabular foundation models. For actuaries evaluating these newer architectures for pricing or underwriting, it's a caution against assuming foundation-model robustness without explicit shift testing.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Bias-corrected Cox regression with AI-extracted covariates via calibration summary statistics", "url": "https://arxiv.org/abs/2607.25868", "source": "arXiv stat.ML", "published": "2026-07-29", "summary": "This paper develops a bias-correction framework for Cox proportional hazards models when covariates come from AI-extraction pipelines rather than direct measurement, correcting the naive estimator via a post-hoc matrix operation built from vendor-reported calibration statistics. It also derives bias-adjusted confidence intervals and a sensitivity diagnostic for when residual bias could still matter. It directly addresses a real, growing problem for actuaries building mortality or claims models from AI-extracted medical or claims records.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Why Workers' Comp Leaders Are Feeling the Squeeze — and Where They're Finding Answers", "url": "https://riskandinsurance.com/why-workers-comp-leaders-are-feeling-the-squeeze-and-where-theyre-finding-answers/", "source": "Risk & Insurance", "published": "2026-07-29", "summary": "Despite stable injury frequencies, workers' compensation programs face mounting complexity as medical and indemnity severity both climbed roughly 4% in recent accident years, with behavioral health claims running at nearly four times the cost of standard claims. An aging workforce and evolving regulations compound the challenge for program leaders trying to manage loss costs. The severity trends are a useful pricing and reserving input for actuaries modeling comp loss development.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "Article", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Why Captives Work: How the Right Culture and Commitment Drive Long-Term Success", "url": "https://riskandinsurance.com/why-captives-work-how-the-right-culture-and-commitment-drive-long-term-success/", "source": "Risk & Insurance", "published": "2026-07-29", "summary": "Captive insurance structures offer greater transparency and control over risk, but the article argues success depends on organizational culture and genuine commitment rather than short-term premium savings. It frames captives as a risk-management mindset requiring financial capacity and long-term perspective, not just an alternative-risk-financing mechanic. For commercial insurance actuaries, it's a reminder that captive feasibility studies must weigh governance readiness alongside actuarial loss projections.", "practiceArea": "ERM", "businessLine": "Commercial Insurance", "itemType": "Article", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Viewpoint: French Climate Lawsuit Offers Window Into Next Round of Global Legal Fight", "url": "https://www.insurancejournal.com/news/international/2026/07/29/879518.htm", "source": "Insurance Journal", "published": "2026-07-29", "summary": "A French court ordered a major European energy company to report emissions from customers' use of its products, expanding corporate climate accountability litigation. The ruling previews a next wave of climate liability claims that could reach beyond direct emitters to companies further down the value chain. Commercial liability and D&O actuaries should treat this as an early signal of emerging climate litigation exposure to monitor in loss reserves.", "practiceArea": "ERM", "businessLine": "Commercial Insurance", "itemType": "Article", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Verisk acquires McKenzie Intelligence Services to enhance catastrophe event insights", "url": "https://www.reinsurancene.ws/verisk-acquires-mckenzie-intelligence-services-to-enhance-catastrophe-event-insights/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "Verisk acquired McKenzie Intelligence Services, a geospatial intelligence firm specializing in real-time catastrophe and conflict event analysis, to strengthen its catastrophe risk solutions portfolio. The deal adds pre-event alerting and post-event exposure-damage assessment capability, both critical inputs for rapid claims triage and loss estimation after a cat event. Catastrophe modeling and reserving actuaries should expect faster, more granular post-event data feeding into loss reserve estimates.", "practiceArea": "Predictive Modeling", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "The Hidden Driver of the High Cost Workers' Comp Claims", "url": "https://riskandinsurance.com/the-hidden-driver-of-the-high-cost-workers-comp-claims/", "source": "Risk & Insurance", "published": "2026-07-29", "summary": "Workplace injuries take roughly twice as long to heal as non-work injuries, a gap the article attributes partly to a \"perceived injustice\" mindset unique to employment relationships. It introduces the Injustice Experience Questionnaire as a tool to flag claims likely to become chronic or catastrophic. For workers' comp reserving actuaries, this is a novel psychosocial predictor worth testing alongside traditional severity indicators in claims triage models.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "Article", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "The Hanover posts record net income of $192m as CEO confirms retirement", "url": "https://www.reinsurancene.ws/the-hanover-posts-record-net-income-of-192m-as-ceo-confirms-retirement/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "The Hanover Insurance Group reported Q2 2026 net income of $191.6 million, up from $157 million a year earlier, with its combined ratio improving to 91.2%, alongside CEO John Roche's confirmed year-end retirement. The improved combined ratio signals genuine underwriting improvement rather than just favorable reserve development or investment gains. Reserving and capital actuaries at commercial carriers can use this as a benchmark for underwriting-cycle performance in the current market.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Services not covered by fee schedules add to rising medical costs: Report", "url": "https://www.businessinsurance.com/services-not-covered-by-fee-schedules-add-to-rising-medical-costs-report/", "source": "Business Insurance", "published": "2026-07-29", "summary": "A growing share of workers' compensation medical spending falls outside state fee-schedule rates, a trend a new report says is contributing to rising medical payments in comp claims. Because fee schedules are the primary lever regulators and payers use to control medical severity trend, erosion of their coverage complicates loss-cost forecasting. Reserving and pricing actuaries in workers' comp should watch this as a driver of upward severity pressure.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Rokstone Agriculture expands livestock offering with new $20m AXA XL capacity agreement", "url": "https://www.reinsurancene.ws/rokstone-agriculture-expands-livestock-offering-with-new-20m-axa-xl-capacity-agreement/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "Rokstone Agriculture announced a new excess livestock facility backed by up to $20 million in AXA XL capacity, lifting total livestock capacity to $30 million. The expansion lets the MGA underwrite a broader range of livestock exposures on a non-admitted basis, a specialty commercial agriculture line with thin historical loss data. Pricing actuaries in specialty and E&S lines should note the added capacity as a signal of underwriting appetite in agricultural risk.", "practiceArea": "Capital Modelling", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Reinsurance market to benefit from newly launched EXPAS explosion risk intelligence platform", "url": "https://www.reinsurancene.ws/reinsurance-market-to-benefit-from-newly-launched-expas-explosion-risk-intelligence-platform/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "EXPAS launched an operational explosion-risk intelligence platform combining engineering evidence and performance data to produce measurable indicators of loss probability at industrial sites. The tool aims to bridge the gap between traditional periodic risk assessments and real-time operational conditions, a data gap that has long complicated E&S property underwriting. Capital modeling and ERM actuaries covering energy and industrial risk should note the platform as a step toward more dynamic exposure monitoring.", "practiceArea": "ERM", "businessLine": "Reinsurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Property insurance rates fall as competition grows", "url": "https://www.businessinsurance.com/property-insurance-rates-fall-as-competition-grows/", "source": "Business Insurance", "published": "2026-07-29", "summary": "Australian commercial property rates fell 15% in Q2 2026, the steepest quarterly decline since the softening cycle began two years ago, driven by excess underwriting capacity. The drop illustrates how quickly rate adequacy can erode once new capacity enters a market, a key input for commercial property pricing models. Actuaries tracking global rate cycles will want to watch whether this softening spreads to other Asia-Pacific commercial lines.", "practiceArea": "Pricing", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Lockton launches data center practice", "url": "https://www.businessinsurance.com/lockton-launches-data-center-practice/", "source": "Business Insurance", "published": "2026-07-29", "summary": "Lockton on Wednesday launched a global data centers and digital infrastructure practice to address risks facing owners, operators, developers, investors and technology providers. The move follows a wave of broker and carrier activity around data center risk, an emerging commercial property and casualty exposure with limited historical loss data. It signals growing demand for specialized underwriting and risk engineering as AI-driven infrastructure buildout accelerates.", "practiceArea": "ERM", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Kumamoto quake losses likely to remain below 2016 levels: Howden Re Japan", "url": "https://www.reinsurancene.ws/kumamoto-quake-losses-likely-to-remain-below-2016-levels-howden-re-japan/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "A magnitude 7.1 earthquake struck Kumamoto Prefecture, and Howden Re Japan's CEO estimates insured losses will stay below the 2016 Kumamoto event, more comparable to the 2024 Noto earthquake, barring significant aftershocks. Semiconductor facilities in the region suspended operations for safety checks, adding a business-interruption dimension to the loss estimate. Reinsurance and catastrophe modeling actuaries will want this early loss-estimate anchor as claims data develops over coming weeks.", "practiceArea": "Capital Modelling", "businessLine": "Reinsurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Insurer Rewards Can Boost Climate Resilience Spending, Aon Says", "url": "https://www.claimsjournal.com/news/national/2026/07/29/339083.htm", "source": "Claims Journal", "published": "2026-07-29", "summary": "An Aon executive argues insurers should reward policyholders who invest in climate-resilience measures rather than relying solely on higher premiums to reflect rising catastrophe risk. The framing challenges standard risk-based pricing logic by treating mitigation incentives as a lever for improving portfolio-wide loss experience, not just individual risk selection. ERM and pricing actuaries evaluating climate adaptation strategies may find this a useful counterpoint to pure rate-based risk signaling.", "practiceArea": "ERM", "businessLine": "Commercial Insurance", "itemType": "Article", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Early denials draw scrutiny as cumulative trauma claims surge", "url": "https://www.businessinsurance.com/early-denials-draw-scrutiny-as-california-cumulative-trauma-claims-surge/", "source": "Business Insurance", "published": "2026-07-29", "summary": "Rapid growth in cumulative trauma claims in California is intensifying scrutiny of how quickly insurers and employers deny such claims, and whether early denials push more disputes into litigation. Cumulative trauma claims are notoriously hard to reserve because onset and causation are diffuse, making claims-handling practices a direct driver of loss development. The trend is a workers' comp reserving signal worth tracking as California's claims environment evolves.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Cost of a Data Breach Reaches Record $5 Million on Average", "url": "https://www.insurancejournal.com/news/national/2026/07/29/879536.htm", "source": "Insurance Journal", "published": "2026-07-29", "summary": "IBM's Cost of a Data Breach Report finds average breach costs have climbed to nearly $5 million, with AI cited as radically shifting cybersecurity risk dynamics. The figure is a standard benchmark cyber underwriters use to calibrate limits, retentions, and loss-cost assumptions for cyber liability programs. Rising average severity alongside AI-driven attack and defense capability suggests continued repricing pressure in commercial cyber insurance.", "practiceArea": "Pricing", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Competition drives Asia insurance rates down 5%: Marsh", "url": "https://www.businessinsurance.com/competition-drives-asia-insurance-rates-down-5-marsh/", "source": "Business Insurance", "published": "2026-07-29", "summary": "Commercial insurance rates across Asia fell 5% in Q2 2026, with cyber posting the steepest decline at 8% amid abundant capacity, according to Marsh. The softening cycle mirrors trends already seen in property and casualty pricing globally, squeezing underwriting margins even as competition intensifies for market share. For pricing actuaries, it signals a need to reassess loss-cost trend assumptions as capaci 24673", "source": "arXiv cs.LG", "published": "2026-07-27", "summary": "Open-source library for causal discovery with regime detection in multivariate nonstationary time series — a practical tool for investigating causal drivers behind shifting loss trends.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Beyond Scale and Generation: Understanding Language Model-based Entity Matching", "url": "https://arxiv.org/abs/2607.24688", "source": "arXiv cs.LG", "published": "2026-07-27", "summary": "The paper studies how language models perform entity matching, the task of identifying records that refer to the same real-world entity, across architectures such as bi-encoders and generative matchers. Entity matching is a common data-engineering problem in insurance, needed to link policyholder, claims, and third-party records across legacy systems. The comparison of which architecture works best is useful guidance for building or improving insurance data-integration pipelines.", "practiceArea": "AI/ML/Deep Learning", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Beyond Aggregate Risk: Role-Stratified Conformal Risk Control for LLM Tool Calls", "url": "https://arxiv.org/abs/2607.24343", "source": "arXiv cs.LG", "published": "2026-07-27", "summary": "This paper extends conformal risk control, a distribution-free uncertainty quantification method, to stratify risk guarantees by the role or type of action being taken rather than a single aggregate bound. The underlying technique is transferable to actuarial uncertainty quantification, where different claim types or risk classes may need separately calibrated error guarantees. It represents a methodological advance in conformal prediction with reach beyond its LLM-agent use case.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Bayesian Feature Extraction using Gaussian and Diffused-gamma Priors for High Dimensional Spatio-Temporal Data", "url": "https://arxiv.org/abs/2607.24378", "source": "arXiv stat.ML", "published": "2026-07-27", "summary": "The paper develops a Bayesian feature-extraction framework for high-dimensional data with sparse structure and spatio-temporal dependence, using Gaussian and diffused-gamma priors. Such methods are directly applicable to catastrophe and climate risk modeling, where losses vary across both geography and time with sparse, correlated structure. It offers actuaries a potential tool for extracting interpretable risk factors from large spatio-temporal exposure datasets.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "A Model for Imbalanced Label Aggregation: A Focus on Minority-Class Detection", "url": "https://arxiv.org/abs/2607.24622", "source": "arXiv stat.ML", "published": "2026-07-27", "summary": "Introduces a model for aggregating imbalanced crowdsourced labels with a focus on minority-class detection, addressing rare-event recall relevant to fraud flagging and claims triage.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": larifies a recurring coverage-gap dispute between personal auto insurers and transportation network companies in commercial/TNC auto claims. It is a data point for actuaries reserving and pricing rideshare-related commercial auto liability exposure.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Jury Awards 78-Year Old Victim $56 Million for Crash Caused by Amazon Delivery Driver", "url": "https://www.claimsjournal.com/editors-picks/2026/07/27/339079.htm", "source": "Claims Journal", "published": "2026-07-27", "summary": "A Massachusetts jury's $56M award against an Amazon delivery driver adds another data point to the nuclear-verdict trend straining commercial auto and fleet liability reserves.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Insurers win coverage fight over Harris Teeter's share of opioid settlement", "url": "https://www.businessinsurance.com/insurers-win-coverage-fight-over-harris-teeters-share-of-opioid-settlement/", "source": "Business Insurance", "published": "2026-07-27", "summary": "A North Carolina court ruled CGL insurers don't owe Harris Teeter's $60.5M share of Kroger's opioid settlement, reinforcing a trend of insurers avoiding coverage for public-nuisance mass-tort liabilities.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Google ordered to defend Starbuck's AI d k-despite-softening-rates/", "source": "Risk & Insurance", "published": "2026-07-27", "summary": "AM Best maintained a stable outlook for the global cyber insurance segment, citing strong demand and continued profitability even as premium growth slows and competition drives rates down. The assessment gives actuaries a rating-agency benchmark for cyber loss experience and capital adequacy as the line matures past its early hard-market phase. It is a useful pricing and ERM signal for a commercial specialty line still short on long-run loss data.", "practiceArea": "Pricing", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "2025 Variance Prize Honors Research on Credibility Theory and Machine Learning", "url": "https://www.casact.org/article/2025-variance-prize-honors-research-credibility-theory-and-machine-learning", "source": "CAS", "published": "2026-07-27", "summary": "CAS's Variance journal prize went to a paper on adjusting manual rates to own experience, blending classical credibility theory with machine learning — directly relevant to commercial-lines ratemaking.", "practiceArea": "Pricing", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Learning Switched Non-Linear Dynamical Systems from a Single Trajectory", "url": "https://arxiv.org/abs/2607.23502", "source": "arXiv stat.ML", "published": "2026-07-26", "summary": "Non-asymptotic bounds for learning regime-switching dynamics from one observed trajectory — relevant to modeling regime shifts in claims frequency, mortality trends, or economic scenario generation.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}, {"date": "2026-07-28", "section": "data_science", "sectionLabel": "Data Science", "headline": "Distributional Split Criteria for Random Forests: Extensions, Shrinkage, and the Robustness of Mean Splitting", "url": "https://arxiv.org/abs/2607.23721", "source": "arXiv stat.ML", "published": "2026-07-26", "summary": "Proposes shrinkage extensions to distributional random forest splitting criteria, improving robustness of tree-based full-distribution estimation — directly applicable to actuarial loss-distribution and reserving models beyond simple mean prediction.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-28", "lastSeen": "2026-07-28", "seenIn": ["2026-07-28"]}], "latestItems": [{"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Bias-corrected Cox regression with AI-extracted covariates via calibration summary statistics", "url": "https://arxiv.org/abs/2607.25868", "source": "arXiv stat.ML", "published": "2026-07-29", "summary": "This paper develops a bias-correction framework for Cox proportional hazards models when covariates come from AI-extraction pipelines rather than direct measurement, correcting the naive estimator via a post-hoc matrix operation built from vendor-reported calibration statistics. It also derives bias-adjusted confidence intervals and a sensitivity diagnostic for when residual bias could still matter. It directly addresses a real, growing problem for actuaries building mortality or claims models from AI-extracted medical or claims records.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Generalised Robust Bayes for Joint Inference of Model and Contamination", "url": "https://arxiv.org/abs/2607.25665", "source": "arXiv stat.ML", "published": "2026-07-29", "summary": "This paper introduces Hölder-Bayes, a Bayesian framework that jointly estimates model parameters and the proportion of contaminated outlier data, rather than only producing qualitatively robust posteriors as prior methods do. It derives theoretical bias bounds and converts posterior uncertainty into an observation-level outlier score without needing an external detection threshold. The joint estimate is relevant to actuarial reserving and pricing, where flagging anomalous claims or loss data matters as much as the underlying parameter estimate.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "FinAbstain: Uncertainty-Calibrated Multimodal RAG for Selective Financial Forecasting", "url": "https://arxiv.org/abs/2607.24875", "source": "arXiv cs.LG", "published": "2026-07-29", "summary": "FinAbstain proposes a research framework for uncertainty-calibrated financial forecasting that combines retrieval-augmented generation with temperature scaling, isotonic regression, and conformal prediction to decide when a model should abstain rather than guess. The abstention-based design directly parallels actuarial practice of flagging cases for human review when model confidence is low. It's a useful template for building selective-prediction pipelines in any forecasting task where overconfidence is costly, including pricing and reserving.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Empirical Evaluation of Out-Of-Distribution Performance of Tabular Foundation Models", "url": "https://arxiv.org/abs/2607.26000", "source": "arXiv cs.LG", "published": "2026-07-29", "summary": "This paper benchmarks nine tabular foundation models, including TabPFN and TabICL variants, on out-of-distribution performance across datasets with label, socioeconomic, and geographic shift, finding all degrade systematically once deployment distributions diverge from training. The result confirms that the classical in-distribution-versus-OOD gap seen in tree-based models has not been solved by tabular foundation models. For actuaries evaluating these newer architectures for pricing or underwriting, it's a caution against assuming foundation-model robustness without explicit shift testing.", "practiceArea": "Predictive Modeling", "businessLine": null, "itemType": "Research", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "data_science", "sectionLabel": "Data Science", "headline": "Rethinking Likelihood Distributions: Student's t Likelihood Boosts Bayesian Neural Network Performance", "url": "https://arxiv.org/abs/2607.25376", "source": "arXiv cs.LG", "published": "2026-07-29", "summary": "This paper tests alternative likelihood distributions for Bayesian neural networks and finds Student's t consistently outperforms the standard Gaussian likelihood across regression tasks, independent of dataset or network architecture. Heavy-tailed likelihoods are already standard for modeling claims severity in actuarial work, so this result extends that intuition into deep uncertainty-quantification methods. It's a simple, easy-to-implement swap that predictive modeling teams using Bayesian neural nets for loss or severity forecasting could test directly.", "practiceArea": "AI/ML/Deep Learning", "businessLine": null, "itemType": "Research", "sortOrder": 0, " iceArea": "Capital Modelling", "businessLine": "Reinsurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "The Hanover posts record net income of $192m as CEO confirms retirement", "url": "https://www.reinsurancene.ws/the-hanover-posts-record-net-income-of-192m-as-ceo-confirms-retirement/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "The Hanover Insurance Group reported Q2 2026 net income of $191.6 million, up from $157 million a year earlier, with its combined ratio improving to 91.2%, alongside CEO John Roche's confirmed year-end retirement. The improved combined ratio signals genuine underwriting improvement rather than just favorable reserve development or investment gains. Reserving and capital actuaries at commercial carriers can use this as a benchmark for underwriting-cycle performance in the current market.", "practiceArea": "Reserving", "businessLine": "Commercial Insurance", "itemType": "News", "sortOrder": 0, "firstSeen": "2026-07-29", "lastSeen": "2026-07-29", "seenIn": ["2026-07-29"]}, {"date": "2026-07-29", "section": "actuarial", "sectionLabel": "Actuarial", "headline": "Rokstone Agriculture expands livestock offering with new $20m AXA XL capacity agreement", "url": "https://www.reinsurancene.ws/rokstone-agriculture-expands-livestock-offering-with-new-20m-axa-xl-capacity-agreement/", "source": "Reinsurance News", "published": "2026-07-29", "summary": "Rokstone Agriculture announced a new excess livestock facility backed by up to $20 million in AXA XL capacity, lifting total livestock capacity to $30 million. The expansion lets the MGA underwrite a broader range of livestock exposures on a non-admitted basis, a specialty commercial agriculture line with thin historical loss data. Pricing actuaries in specialty and E&S lines should note the added capacity as a signal of <script>
(function () {
  var D = JSON.parse(document.getElementById('payload').textContent);
  var PA = ["Pricing", "Reserving", "Predictive Modeling", "AI/ML/Deep Learning", "ERM", "Capital Modelling", "Other"], BL = ["Personal Insurance", "Commercial Insurance", "Reinsurance", "Consulting", "Other"], IT = ["Publication", "Research", "Article", "News"];
  var state = { q: '', publishedDate: '', section: '', pa: [], bl: [], itemType: [], source: '', view: 'archive' };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  $('sub').textContent = D.dates.length
    ? D.items.length + ' items across ' + D.dates.length + ' day' +
      (D.dates.length === 1 ? '' : 's') + ' — latest ' + D.dates[0]
    : 'No snapshots yet. Run ./refresh.sh to populate data.';

  var publishedDateSel = $('publishedDate');
  var quarterItems = D.items || [];
  var quarters = quarterItems.map(function (i) { return i.published ? i.published.slice(0, 4) + ' Q' + Math.ceil(parseInt(i.published.slice(5, 7), 10) / 3) : null; })
    .filter(function (q, n, a) { return q && a.indexOf(q) === n; }).sort().reverse();
  publishedDateSel.innerHTML = '<option value="">All published quarters</option>' +
    quarters.map(function (q) { return '<option value="' + esc(q) + '">' + esc(q) + '</option>'; }).join('');

  var sources = D.items.map(function (i) { return i.source; })
    .filter(function (s, n, a) { return a.indexOf(s) === n; }).sort();
  $('source').innerHTML = '<option value="">All sources</option>' +
    sources.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');

  function chips(host, values, key) {
    host.innerHTML = values.map(function (v) {
      return '<button class="chip" type="button" aria-pressed="false" data-v="' + esc(v) + '">' +
        esc(v) + '</button>';
    }).join('');
    host.addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      var v = b.dataset.v, on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', on ? 'false' : 'true');
      state[key] = on ? state[key].filter(function (x) { return x !== v; }) : state[key].concat([v]);
      render();
    });
  }
  chips($('pa'), PA, 'pa');
  chips($('bl'), BL, 'bl');
  chips($('it'), IT, 'itemType');

  ['q', 'publishedDate', 'section', 'source'].forEach(function (id) {
    $(id).addEventListener('input', function (e) { state[id] = e.target.value; render(); });
  });
  $('viewMode').addEventListener('change', function (e) {
    state.view = e.target.value;
    render();
  });

  var addBtn = $('addSearch');
  var searchInput = $('searchQuery');
  var searchType = $('searchType');
  function addSearchItem() {
    var keyword = (searchInput.value || '').trim();
    if (!keyword) {
      say('Enter a keyword first.', 'warn');
      return;
    }
    addBtn.disabled = true;
    say('Adding to the database…');
    fetch('/api/search/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keyword: keyword, itemType: searchType.value })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) {
          say('Added — reloading the dashboard…', 'ok');
          setTimeout(function () { location.reload(); }, 600);
        } else {
          say(j.error || 'Could not add the item.', 'err');
          addBtn.disabled = false;
        }
      })
      .catch(function () {
        say('Could not reach the local helper. Run python3 serve.py first.', 'err');
        addBtn.disabled = false;
      });
  }
  addBtn.addEventListener('click', addSearchItem);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addSearchItem(); }
  });
  $('reset').addEventListener('click', function () {
    state = { q: '', publishedDate: '', section: '', pa: [], bl: [], itemType: [], source: '', view: 'archive' };
    ['q', 'publishedDate', 'section', 'source'].forEach(function (id) { $(id).value = ''; });
    $('viewMode').value = 'archive';
    Array.prototype.forEach.call(document.querySelectorAll('.chip[aria-pressed]'), function (b) {
      b.setAttribute('aria-pressed', 'false');
    });
    render();
  });

  function match(i) {
    var publishQuarter = i.published ? i.published.slice(0, 4) + ' Q' + Math.ceil(parseInt(i.published.slice(5, 7), 10) / 3) : null;
    if (state.publishedDate && publishQuarter !== state.publishedDate) return false;
    if (state.section && i.section !== state.section) return false;
    if (state.source && i.source !== state.source) return false;
    if (state.pa.length && state.pa.indexOf(i.practiceArea) < 0) return false;
    if (state.bl.length && (!i.businessLine || state.bl.indexOf(i.businessLine) < 0)) return false;
    if (state.itemType.length && state.itemType.indexOf(i.itemType) < 0) return false;
    if (state.q) {
      var hay = (i.headline + ' ' + i.summary + ' ' + i.source).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
    }
    return true;
  }

  function card(i) {
    var tags = '<span class="tag pa">' + esc(i.practiceArea) + '</span>' +
      (i.businessLine ? '<span class="tag">' + esc(i.businessLine) + '</span>' : '') +
      '<span class="tag">' + esc(i.itemType) + '</span>';
    return '<article>' +
      '<h3><a href="' + esc(i.url) + '" target="_blank" rel="noopener">' + esc(i.headline) + '</a></h3>' +
      '<div class="meta"><b>' + esc(i.source) + '</b> · published ' + esc(i.published) +
        ' · collected ' + esc(i.date) + '</div>' +
      '<p class="sum">' + esc(i.summary) + '</p>' +
      '<div class="tags">' + tags + '</div>' +
      '</article>';
  }

  function render() {
    var sourceItems = state.view === 'latest' ? (D.latestItems || []) : (D.items || []);
    var shown = sourceItems.filter(match);
    $('count').textContent = shown.length + ' of ' + sourceItems.length + ' items';

    if (!shown.length) {
      $('list').innerHTML = '<p class="empty">Nothing matches these filters.</p>';
      return;
    }
    var html = '';
    [['actuarial', 'Actuarial'], ['data_science', 'Data Science']].forEach(function (s) {
      var group = shown.filter(function (i) { return i.section === s[0]; });
      if (!group.length) return;
      html += '<h2 class="sec">' + s[1] + ' · ' + group.length + '</h2>' +
        group.map(card).join('');
    });
    $('list').innerHTML = html;
  }

  // ---- Refresh button -------------------------------------------------------
  // Served from localhost by serve.py, the button really runs the refresh. On the
  // hosted page there is no backend to call, so it opens the scheduled routine
  // instead — triggering a cloud run from the browser would need a token, and this
  // page is public.
  var ROUTINE_URL = "https://claude.ai/code/routines/trig_011WCaBkju3UMBApJV2QZ2W6";
  var local = ['localhost', '127.0.0.1', '[::1]', ''].indexOf(location.hostname) >= 0
    && location.protocol !== 'file:';
  var btn = $('refresh'), statusEl = $('status');

  function say(msg, kind) {
    statusEl.hidden = !msg;
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  btn.textContent = local ? 'Refresh now' : 'Refresh…';
  btn.title = local
    ? "Fetch today's news and rebuild this page"
    : 'Opens the scheduled routine, where you can run it on demand';

  btn.addEventListener('click', function () {
    if (!local) {
      window.open(ROUTINE_URL, '_blank', 'noopener');
      say('Opened the routine in a new tab — press “Run now” there. This page picks up the ' +
          'result a minute or two after the run finishes. To refresh from your own machine ' +
          'instead, run: python3 serve.py');
      return;
    }
    btn.disabled = true;
    say('Starting…');
    fetch('/api/refresh', { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.state === 'busy') { say('A refresh is already running.', 'warn'); btn.disabled = false; }
        else { poll(); }
      })
      .catch(function () {
        say('Could not reach the local helper. Start it with: python3 serve.py', 'err');
        btn.disabled = false;
      });
  });

  function poll() {
    fetch('/api/refresh/status')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.state === 'running') {
          say('Reading articles… this takes a few minutes.' + (j.last ? ' — ' + j.last : ''));
          setTimeout(poll, 2500);
        } else if (j.state === 'done') {
          say('Done — reloading.', 'ok');
          setTimeout(function () { location.reload(); }, 800);
        } else {
          say('Refresh failed: ' + (j.last || 'check the serve.py console'), 'err');
          btn.disabled = false;
        }
      })
      .catch(function () {
        say('Lost contact with the local helper.', 'err');
        btn.disabled = false;
      });
  }

  $('foot').textContent = 'Generated ' + D.generated + ' by build.py · static file, no runtime dependencies';
  render();
})();
</script>
</body>
</html>
